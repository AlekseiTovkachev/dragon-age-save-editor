<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save Editor — UI Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="explorer">
  <header class="explorer-head">
    <div class="explorer-brand">
      <h1>Save Editor &mdash; UI Wireframes</h1>
      <p>DRAGON AGE &middot; ORIGINS COLOURS &middot; DA2 INTERFACE STYLE &middot; LO-FI EXPLORATION</p>
    </div>
    <nav class="explorer-tabs" id="tabs"></nav>
  </header>

  <main class="explorer-body" id="body"></main>
</div>

<!-- Tab definitions + content templates -->
<script>
const TABS = [
  { id: "system",     title: "System",     hint: "Palette & vibe" },
  { id: "shell",      title: "App Shell",  hint: "Topbar + nav" },
  { id: "characters", title: "Characters", hint: "Overview" },
  { id: "abilities",  title: "Abilities",  hint: "The big rethink" },
  { id: "inventory",  title: "Inventory",  hint: "Item editor" },
  { id: "plotflags",  title: "Plot Flags", hint: "DA2 choices" },
  { id: "summary",    title: "Summary",    hint: "Recommended mix" },
];

function $(sel, root=document) { return root.querySelector(sel); }

function setTab(id) {
  for (const tab of document.querySelectorAll(".explorer-tab")) {
    tab.classList.toggle("is-active", tab.dataset.id === id);
  }
  for (const tpl of document.querySelectorAll(".tab-content")) {
    tpl.style.display = tpl.dataset.id === id ? "" : "none";
  }
  history.replaceState(null, "", "#" + id);
  window.scrollTo({ top: 0 });
}

function renderTabs() {
  const root = $("#tabs");
  root.innerHTML = "";
  TABS.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "explorer-tab";
    b.dataset.id = t.id;
    b.innerHTML = `<span class="tab-num">${String(i+1).padStart(2,"0")}</span>${t.title}`;
    b.onclick = () => setTab(t.id);
    root.appendChild(b);
  });
}

window.addEventListener("DOMContentLoaded", () => {
  renderTabs();
  const initial = location.hash.replace("#", "") || TABS[0].id;
  setTab(TABS.find(t => t.id === initial) ? initial : TABS[0].id);
});
</script>

<!-- Tab contents are loaded via separate scripts that append into #body -->
<script src="tabs/_helpers.js"></script>
<script src="tabs/system.js"></script>
<script src="tabs/shell.js"></script>
<script src="tabs/characters.js"></script>
<script src="tabs/abilities.js"></script>
<script src="tabs/inventory.js"></script>
<script src="tabs/plotflags.js"></script>
<script src="tabs/summary.js"></script>

</body>
</html>
