[package]
name = "dragon-age-save-editor-tauri"
version = "0.9.0"
edition = "2024"
authors = ["Aleksei Tovkachev"]
license = "MIT"

[[bin]]
name = "dragon-age-save-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dragon-age-save-editor = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
